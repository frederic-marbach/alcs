version: "v0.4"

project:
  name: "Continuity of solutions to abstract linear control systems"
  description: >-
    Formalization of all the numbered statements of F. Marbach, "Continuity of
    solutions to abstract linear control systems" (2026), https://hexagonmath.org/2610.00022.
    For abstract linear control systems in the sense of Weiss (a strongly continuous
    semigroup T on a Banach space X and bounded input maps Phi_t : L^p(R_+; U) -> X
    satisfying the concatenation identity), the main results are: for p = infinity,
    every system is zero-class, i.e. the operator norm of Phi_t tends to zero as
    t -> 0+ (Theorem 1.5), and t -> Phi_t u is continuous on [0, infinity) for every
    u in L^infinity (Corollary 1.6), a positive answer to Weiss' 1989 Problem 2.4. No
    integral representation of the input maps is assumed. The proof packs nearly
    extremal controls into one bounded operator on l^infinity and uses Phillips'
    lemma (Lemma 2.2), which is proved here. The development also covers the
    continuity of semigroup orbits (Proposition 1.2), the classical case p < infinity
    (Proposition 1.3), and the examples of Section 3: a non zero-class system for
    p < infinity (Proposition 3.1), an exotic invariant mean on periodic L^infinity
    functions (Lemma 3.2), and a scalar system with p = infinity without integral
    representation and not E_F-admissible for any Young function F (Proposition 3.3).
  authors: ["Frédéric Marbach"]
  responsible_maintainers: ["Frédéric Marbach"]
  license: "Apache-2.0"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.OC", "math.FA"]
  msc2020: ["93C25", "47D06", "93C05", "46B45"]

sources:
  - title: "Continuity of solutions to abstract linear control systems"
    authors: ["Frédéric Marbach"]
    type: article
    id: "https://hexagonmath.org/2610.00022"
    relationship: formalizes
    location: >-
      All numbered statements: Definitions 1.1 and 1.4, Propositions 1.2 and 1.3,
      Theorem 1.5, Corollary 1.6, Lemmas 2.1, 2.2 and 2.3, Proposition 3.1, Lemma 3.2
      and Proposition 3.3. The main results
      submitted to Comparator are Theorem 1.5 (thm:p-infty-zero-class) and
      Corollary 1.6 (cor:p-infty-solution-continuous).
    author_endorsement: participated
    note: >-
      The author of the paper is the author of this formalization. README.md maps
      each numbered statement (number and LaTeX label) to its Lean declaration and file.
  - title: "Admissibility of unbounded control operators"
    authors: ["George Weiss"]
    type: article
    id: "doi:10.1137/0327028"
    relationship: background
    location: "SIAM J. Control Optim. 27 (1989), 527–545; Proposition 2.3 and Problem 2.4"
    note: >-
      Definition of abstract linear control systems; Proposition 2.3 is Proposition 1.3
      of the paper (proved in the formalization), and Problem 2.4 is answered by
      Corollary 1.6.
  - title: "On linear transformations"
    authors: ["R. S. Phillips"]
    type: article
    relationship: background
    location: "Trans. Amer. Math. Soc. 48 (1940), 516–541, Corollary 3.4"
    note: >-
      Phillips' lemma (Lemma 2.2 of the paper), quoted there from this source. It is
      proved in ALCS/Background/Phillips.lean: first the diagonal statement
      mu_n(e_n) -> 0 by a finite-sum and recursive-selection argument, then the full
      statement sum_k |mu_n(e_k)| -> 0 by a gliding-hump reduction to it.
  - title: "Semigroups of Linear Operators and Applications to Partial Differential Equations"
    authors: ["Amnon Pazy"]
    type: book
    relationship: background
    location: "Springer, 1983, Chapter 1, Theorem 2.2 and Corollary 2.3"
    note: "Exponential bound and continuity of orbits of C0-semigroups; proved in ALCS/Background/Semigroup.lean."
  - title: "ISS and integral ISS coincide for linear systems with bounded inputs"
    authors: ["Sahiba Arora", "Philip Preußler", "Felix Schwenninger"]
    type: article
    id: "arXiv:2609.40348v1"
    relationship: background
    location: "Proposition 2.1 and the main theorem"
    note: >-
      Independent related preprint (September 2026), acknowledged in the paper: for
      systems given by a control operator, L^infinity-admissibility implies Orlicz-heart
      admissibility. Proposition 3.3 shows that this does not extend to all abstract
      input maps. Not a dependency of the Lean proofs.

