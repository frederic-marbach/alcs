fidelity:
  divergences: >-
    (1) Time-indexed families T and Phi are functions on R; only nonnegative times
    occur in the axioms and conclusions. (2) Inputs are Mathlib Lp classes for Lebesgue
    measure restricted to [0, infinity); the concatenation identity is required for
    every input a.e. equal to the concatenation, which is equivalent to the paper's
    identity. (3) Theorem 1.5, Step 3: each pulse is played on its own interval
    [1 - r_n - h_n, 1 - r_n), with zero input in the gaps, and the operator is
    evaluated at time 1, instead of consecutive intervals and the accumulated time H;
    the argument is otherwise the same. (4) Proposition 1.3 has no proof in the paper
    (reference to Weiss 1989); the classical argument is formalized. (5) Section 3:
    intervals [a, b) become (a, b] (null-set change); in Proposition 3.1 the input map
    uses 0 < s <= t instead of 0 <= s < t. (6) Proposition 3.3: the integral
    representation is specialized to the scalar case X_{-1} = R (A = 0), as in the
    paper's proof; Young functions are a larger class than in the paper (only F(0) = 0,
    nonnegativity, convexity, continuity and growth are recorded), so (iii) is proved
    for more functions; E_F-admissibility is required at all t >= 0 for inputs with
    finite modular. Step 3 of the proof uses a periodic open dense set of small measure
    on which the mean equals one, instead of a set E with J(1_E) != |E|.

automation:
  methods:
    - method: copilot
      models: ["GPT-6 Pro", "Opus 5.5"]
      tool_setup: >-
        AI-assisted writing, by the author, of the Lean statements and proofs.
  notes: >-
    The informal proofs of Theorem 1.5 and Corollary 1.6 were produced by GPT-6 Pro
    from the author's notes and rewritten by the author (see the "Research provenance"
    section of the paper). No complete model-by-declaration attribution or prompt log
    is available. Costs were not tracked.

review:
  status: agent-reviewed
  reviewers: ["claude-opus-5-5 in Claude (Cowork)"]
  notes: >-
    The statements were compared with the paper by AI agents; the build (lake build,
    no sorry outside Challenge.lean) was checked by the author. No independent human
    review has been reported.

