name = "ALCS"
version = "0.1.0"
defaultTargets = ["ALCS", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# The whole development: `ALCS.lean` imports every file of `ALCS/`.
[[lean_lib]]
name = "ALCS"

# Statements of the two main results, for Comparator (deliberate `sorry`s).
[[lean_lib]]
name = "Challenge"

# Proofs of the two main results, checked by Comparator against `Challenge`.
[[lean_lib]]
name = "Solution"
